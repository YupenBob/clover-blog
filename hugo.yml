baseURL: '/'
languageCode: 'zh-cn'
title: '🍀 Clover Blog'

theme: 'PaperMod'

paginate: 5
summaryLength: 30

menu:
  main:
    - name: 首页
      url: /
      weight: 1
    - name: 归档
      url: /archives/
      weight: 2
    - name: 关于
      url: /about/
      weight: 3

outputs:
  home:
    - HTML
    - RSS
  page:
    - HTML

params:
  author: Clover
  description: 🍀 Clover 的博客
  defaultTheme: auto
  
  homeSections: ["post"]
  
  # PaperMod cover
  cover:
    hiddenInList: false
    hiddenInSingle: false
    
  # assets
  fusejs:
    enabled: true
    
  # search
  search:
    enabled: true
    type: fusejs
    resultsPerPage: 10
    
  # comments
  comments:
    enabled: false

  # pagination info
  showPaginationStepInfo: true
  
  # Post meta
  showDate: true
  showWordCount: true
  showReadingTime: true
  showLastmod: true
  
  # Table of Contents
  TOC: true
  
  # breadcrumb
  breadcrumbs: true
  
  # archive
  archivePaginate: 5

# Markup
markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    lineNos: true

# Security
security:
  enableInlineShortcodes: false
